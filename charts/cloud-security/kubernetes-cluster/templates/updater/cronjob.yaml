apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    {{- include "annotations" . | nindent 4 }}
  labels:
    {{- include "labels" . | nindent 4 }}
    {{- include "updater.labels" . | nindent 4 }}
  name: {{ include "updater.resourceNamePrefix" . }}-cronjob
  namespace: {{ include "namespace" . }}
spec:
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 3
      template:
        metadata:
          {{- with (default .Values.pod.annotations .Values.updater.pod.annotations) }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          labels:
            {{- include "labels" . | nindent 12 }}
            {{- include "updater.labels" . | nindent 12 }}
            {{- with (default .Values.pod.labels .Values.updater.pod.labels) }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          {{- with (default .Values.pod.affinity .Values.updater.pod.affinity) }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          automountServiceAccountToken: true
          restartPolicy: Never
          containers:
            - args:
                - updater
                - --api-key-token-file-path
                - {{ include "apiKeyTokenFilePath" . | quote }}
                - --api-url
                - {{ .Values.apiUrl | quote }}
                - --application-version
                - {{ .Chart.AppVersion | quote }}
                - --helm-release-name
                - {{ print .Release.Namespace ":" .Release.Name | quote }}
                {{- if .Values.name }}
                - --name
                - {{ .Values.name | quote }}
                {{- end }}
                {{- if .Values.proxyUrl }}
                - --proxy-url
                - {{ .Values.proxyUrl | quote }}
                {{- end }}
                {{- if .Values.accountId }}
                - --tenant-raw-id
                - {{ include "accountId" . | quote }}
                {{- end }}
              {{- include "containerEnvironmentVariables" . | nindent 14 }}
              image: {{ include "containerImage" . }}
              imagePullPolicy: Always
              name: {{ include "updater.resourceNamePrefix" . }}-container
              {{- with (default .Values.pod.resources .Values.updater.pod.resources) }}
              resources:
              {{- toYaml . | nindent 16 }}
              {{- end }}
              securityContext:
                {{- include "containerSecurityContext" (dict "securityContext" (default .Values.pod.containers.securityContext .Values.updater.pod.containers.securityContext)) | nindent 16 }}
              {{- $volumeMounts := print (include "containerCaCertificateVolumeMount" .) "\n" (include "containerSecretsVolumeMount" .) }}
              {{- with trim $volumeMounts }}
              volumeMounts:
                {{- . | nindent 16 }}
              {{- end }}
          {{- with (include "containerImagePullSecretNames" (dict "root" .) | trim) }}
          imagePullSecrets:
            {{- . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "podSecurityContext" (dict "root" . "workloadContext" .Values.updater.pod.securityContext) | nindent 12 }}
          serviceAccountName: {{ include "updater.resourceNamePrefix" . }}-service-account
          {{- with (default .Values.pod.tolerations .Values.updater.pod.tolerations) }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $volumes := print (include "containerCaCertificateVolume" (dict "root" .)) "\n" (include "containerSecretsVolume" (dict "root" .)) }}
          {{- with trim $volumes }}
          volumes:
            {{- . | nindent 12 }}
          {{- end }}
      ttlSecondsAfterFinished: 7200
  schedule: "0 * * * *"