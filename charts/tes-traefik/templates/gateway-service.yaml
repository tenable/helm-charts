---
# TES Gateway Service — ClusterIP by default, NodePort optional for testing.
# External traffic enters via the 'tes' LoadBalancer Service (SC chart) which
# selects Traefik pods when global.traefik.enabled=true, or via a Kubernetes
# Ingress resource when global.ingress.enabled=true.
# For NodePort testing, set gateway.serviceType=NodePort and define nodePort values.
apiVersion: v1
kind: Service
metadata:
  name: tes-traefik
  namespace: {{ .Release.Namespace }}
  labels:
    app: tes-traefik
    app.kubernetes.io/name: tes-traefik
    app.kubernetes.io/component: gateway
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.serviceType | default "ClusterIP" }}
  {{- if .Values.gateway.loadBalancerIP }}
  loadBalancerIP: {{ .Values.gateway.loadBalancerIP }}
  {{- end }}
  {{- if .Values.gateway.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml .Values.gateway.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  {{- if .Values.gateway.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.gateway.externalTrafficPolicy }}
  {{- end }}
  {{- if .Values.gateway.sessionAffinity }}
  sessionAffinity: {{ .Values.gateway.sessionAffinity }}
  {{- end }}
  {{- if and (eq (.Values.gateway.serviceType | default "ClusterIP") "LoadBalancer") .Values.gateway.allocateLoadBalancerNodePorts }}
  allocateLoadBalancerNodePorts: {{ .Values.gateway.allocateLoadBalancerNodePorts }}
  {{- end }}
  selector:
    lb: tes-traefik
  ports:
  # HTTPS port (main SecurityCenter access)
  - name: https
    port: {{ .Values.gateway.ports.https.port }}
    targetPort: {{ .Values.gateway.ports.https.targetPort }}
    protocol: {{ .Values.gateway.ports.https.protocol }}
    {{- if and (eq (.Values.gateway.serviceType | default "ClusterIP") "NodePort") .Values.gateway.ports.https.nodePort }}
    nodePort: {{ .Values.gateway.ports.https.nodePort }}
    {{- end }}
  {{- if .Values.gateway.ports.sensor.enabled }}
  # Sensor port (Nessus scanners)
  - name: sensor
    port: {{ .Values.gateway.ports.sensor.port }}
    targetPort: {{ .Values.gateway.ports.sensor.targetPort }}
    protocol: {{ .Values.gateway.ports.sensor.protocol }}
    {{- if and (eq ($.Values.gateway.serviceType | default "ClusterIP") "NodePort") .Values.gateway.ports.sensor.nodePort }}
    nodePort: {{ .Values.gateway.ports.sensor.nodePort }}
    {{- end }}
  {{- end }}
  {{- with index .Values.gateway.ports "consec-scanner" }}
  {{- if .enabled }}
  # Consec scanner port (Container Security scanners)
  - name: consec-scanner
    port: {{ .port }}
    targetPort: {{ .targetPort }}
    protocol: {{ .protocol }}
    {{- if and (eq ($.Values.gateway.serviceType | default "ClusterIP") "NodePort") .nodePort }}
    nodePort: {{ .nodePort }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- if .Values.gateway.ports.additional }}
  # Additional ports
  {{- range .Values.gateway.ports.additional }}
  - name: {{ .name }}
    port: {{ .port }}
    targetPort: {{ .targetPort }}
    protocol: {{ .protocol }}
    {{- if and (eq ($.Values.gateway.serviceType | default "ClusterIP") "NodePort") .nodePort }}
    nodePort: {{ .nodePort }}
    {{- end }}
  {{- end }}
  {{- end }}
