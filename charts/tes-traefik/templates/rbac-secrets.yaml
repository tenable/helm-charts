{{- if .Values.certificates.security.rbacEnabled }}
---
# Role for Traefik Secret Access
# Restricts access to TLS and mTLS certificates to Traefik service account only
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: traefik-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rbac
rules:
  # get can be scoped by name — restrict to only the TLS secrets Traefik needs
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.certificates.external.secretName }}  # External TLS certificate
      - {{ .Values.certificates.certManager.secretName }}  # Backend mTLS certificate
    verbs: ["get"]
  # list/watch cannot be scoped by resourceNames in Kubernetes RBAC;
  # required for Traefik to detect cert rotation
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "watch"]
---
# RoleBinding for Traefik Service Account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rbac
subjects:
  - kind: ServiceAccount
    name: {{ printf "%s-traefik" .Release.Name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: traefik-secret-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}