{{- if and .Values.edgeCases.conditionalHeaders.enabled (include "tes-traefik.domain" .) }}
---
# IngressRoute for Container Security Assets - No Cache
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tes-consec-assets
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - https
  routes:
    - match: Host("{{ include "tes-traefik.domain" . }}") && PathPrefix("/tes/gateway/blades/consec/w/assets/")
      kind: Rule
      priority: 95
      middlewares:
        - name: security-headers
        - name: cache-consec-assets
        - name: remove-range-headers
      services:
        - name: {{ .Values.tes.consoleSecurityService }}
          port: {{ .Values.tes.consoleSecurityPort }}
          scheme: https
          serversTransport: {{ .Release.Namespace }}-{{- if eq .Values.defaultTransport "mtls" }}{{ .Values.serversTransports.mtls.name }}{{- else }}{{ .Values.serversTransports.insecureSkipVerify.name }}{{- end }}
    - match: Host("{{ include "tes-traefik.domain" . }}") && PathPrefix("/tes/gateway/blades/consec/w/static/")
      kind: Rule
      priority: 95
      middlewares:
        - name: security-headers
        - name: cache-consec-assets
        - name: remove-range-headers
      services:
        - name: {{ .Values.tes.consoleSecurityService }}
          port: {{ .Values.tes.consoleSecurityPort }}
          scheme: https
          serversTransport: {{ .Release.Namespace }}-{{- if eq .Values.defaultTransport "mtls" }}{{ .Values.serversTransports.mtls.name }}{{- else }}{{ .Values.serversTransports.insecureSkipVerify.name }}{{- end }}
    - match: Host("{{ include "tes-traefik.domain" . }}") && PathPrefix("/tes/gateway/blades/consec/assets/")
      kind: Rule
      priority: 95
      middlewares:
        - name: security-headers
        - name: cache-consec-assets
        - name: remove-range-headers
      services:
        - name: {{ .Values.tes.consoleSecurityService }}
          port: {{ .Values.tes.consoleSecurityPort }}
          scheme: https
          serversTransport: {{ .Release.Namespace }}-{{- if eq .Values.defaultTransport "mtls" }}{{ .Values.serversTransports.mtls.name }}{{- else }}{{ .Values.serversTransports.insecureSkipVerify.name }}{{- end }}
  tls:
    secretName: {{ .Values.certificates.external.secretName | quote }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tes-gateway-consec-legacy
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - https
  routes:
    - match: Host("{{ include "tes-traefik.domain" . }}") && PathPrefix("/tes/gateway/blades/consec/")
      kind: Rule
      priority: 92
      middlewares:
        - name: security-headers
        {{- if .Values.rateLimit.enabled }}
        - name: {{ .Values.rateLimit.api.name | default "tes-api-rate-limit" }}
        {{- end }}
        - name: remove-range-headers
      services:
        - name: {{ .Values.tes.consoleSecurityService }}
          port: {{ .Values.tes.consoleSecurityPort }}
          scheme: https
          serversTransport: {{ .Release.Namespace }}-{{- if eq .Values.defaultTransport "mtls" }}{{ .Values.serversTransports.mtls.name }}{{- else }}{{ .Values.serversTransports.insecureSkipVerify.name }}{{- end }}
  tls:
    secretName: {{ .Values.certificates.external.secretName | quote }}
---
# IngressRoute for SC UI v2 - No Content Encoding
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tes-sc-ui-v2
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - https
  routes:
    - match: Host("{{ include "tes-traefik.domain" . }}") && PathPrefix("/tes/gateway/blades/sc/sc-ui-v2/")
      kind: Rule
      priority: 95
      middlewares:
        - name: security-headers
        - name: no-encoding-sc-ui
        - name: remove-range-headers
      services:
        - name: {{ .Values.tes.securityCenterService }}
          port: {{ .Values.tes.securityCenterPort }}
          scheme: https
          serversTransport: {{ .Release.Namespace }}-{{- if eq .Values.defaultTransport "mtls" }}{{ .Values.serversTransports.mtls.name }}{{- else }}{{ .Values.serversTransports.insecureSkipVerify.name }}{{- end }}
  tls:
    secretName: {{ .Values.certificates.external.secretName | quote }}
---
# IngressRoute for Font Files - No Cache
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tes-fonts
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - https
  routes:
    - match: Host("{{ include "tes-traefik.domain" . }}") && PathRegexp("\\.(woff|ttf)$")
      kind: Rule
      priority: 100
      middlewares:
        - name: security-headers
        - name: cache-fonts
        - name: remove-range-headers
      services:
        - name: {{ .Values.tes.securityCenterService }}
          port: {{ .Values.tes.securityCenterPort }}
          scheme: https
          serversTransport: {{ .Release.Namespace }}-{{- if eq .Values.defaultTransport "mtls" }}{{ .Values.serversTransports.mtls.name }}{{- else }}{{ .Values.serversTransports.insecureSkipVerify.name }}{{- end }}
  tls:
    secretName: {{ .Values.certificates.external.secretName | quote }}
---
# IngressRoute for Platform Static Assets - With Cache
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tes-platform-assets
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - https
  routes:
    - match: Host("{{ include "tes-traefik.domain" . }}") && PathPrefix("/tes/gateway/blades/platform/w/static/")
      kind: Rule
      priority: 95
      middlewares:
        - name: security-headers
        - name: cache-consec-assets
        - name: remove-range-headers
      services:
        - name: {{ .Values.tes.platformUIService }}
          port: {{ .Values.tes.platformUIPort }}
          scheme: https
          serversTransport: {{ .Release.Namespace }}-{{- if eq .Values.defaultTransport "mtls" }}{{ .Values.serversTransports.mtls.name }}{{- else }}{{ .Values.serversTransports.insecureSkipVerify.name }}{{- end }}
  tls:
    secretName: {{ .Values.certificates.external.secretName | quote }}
---
# IngressRoute for Exposure Response API - Routes /tes/gateway/blades/platform/er/ to tes-exposure-response
# Priority 93: higher than platform-ui (90) so API calls don't get served the frontend HTML
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tes-exposure-response
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - https
  routes:
    - match: Host("{{ include "tes-traefik.domain" . }}") && PathPrefix("/tes/gateway/blades/platform/er/")
      kind: Rule
      priority: 93
      middlewares:
        - name: security-headers
        - name: strip-platform-er-prefix
      services:
        - name: {{ .Values.tes.exposureResponseService }}
          port: {{ .Values.tes.exposureResponsePort }}
          scheme: https
          serversTransport: {{ .Release.Namespace }}-{{- if eq .Values.defaultTransport "mtls" }}{{ .Values.serversTransports.mtls.name }}{{- else }}{{ .Values.serversTransports.insecureSkipVerify.name }}{{- end }}
  tls:
    secretName: {{ .Values.certificates.external.secretName | quote }}
---
# IngressRoute for Platform UI - Routes /tes/gateway/blades/platform/ to tes-platform-ui
# Priority 90: lower than /ls/ (95), /w/static/ (95), /er/ (93) so those more-specific routes still win
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tes-platform-ui
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - https
  routes:
    - match: Host("{{ include "tes-traefik.domain" . }}") && PathPrefix("/tes/gateway/blades/platform/")
      kind: Rule
      priority: 90
      middlewares:
        - name: security-headers
        - name: remove-range-headers
      services:
        - name: {{ .Values.tes.platformUIService }}
          port: {{ .Values.tes.platformUIPort }}
          scheme: https
          serversTransport: {{ .Release.Namespace }}-{{- if eq .Values.defaultTransport "mtls" }}{{ .Values.serversTransports.mtls.name }}{{- else }}{{ .Values.serversTransports.insecureSkipVerify.name }}{{- end }}
  tls:
    secretName: {{ .Values.certificates.external.secretName | quote }}
{{- end }}
