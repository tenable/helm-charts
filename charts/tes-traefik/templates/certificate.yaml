{{- if .Values.certificates.certManager.enabled }}
---
# cert-manager Certificate CR for Backend mTLS (Traefik → SC/Consec)
# This certificate is used for client authentication in backend connections
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-backend-mtls
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: certificate
spec:
  # Secret name for internal mTLS client cert
  secretName: {{ .Values.certificates.certManager.secretName }}

  # Certificate duration and renewal
  duration: {{ .Values.certificates.certManager.duration }}
  renewBefore: {{ .Values.certificates.certManager.renewBefore }}

  # Subject configuration
  commonName: {{ .Values.certificates.certManager.commonName }}

  # DNS names for service discovery
  dnsNames:
    - traefik
    - traefik.{{ .Release.Namespace }}
    - traefik.{{ .Release.Namespace }}.svc
    - traefik.{{ .Release.Namespace }}.svc.cluster.local

  issuerRef:
    {{- if eq .Values.certificates.certManager.issuerRef.kind "Issuer" }}
    name: {{ .Release.Namespace }}-{{ .Values.certificates.certManager.issuerRef.name }}
    {{- else }}
    name: {{ .Values.certificates.certManager.issuerRef.name }}
    {{- end }}
    kind: {{ .Values.certificates.certManager.issuerRef.kind }}
    group: cert-manager.io

  # Key configuration
  privateKey:
    algorithm: RSA
    size: 2048

  # Usage
  usages:
    - digital signature
    - key encipherment
    - client auth
{{- end }}