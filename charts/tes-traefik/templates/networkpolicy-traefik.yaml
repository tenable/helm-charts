{{- if .Values.networkPolicy.enabled }}
---
# NetworkPolicy for Traefik Ingress/Egress Restrictions
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress

  # Ingress: Allow traffic on designated ports
  ingress:
    - from:
        - podSelector: {}  # Allow from any pod in namespace (LoadBalancer handles external traffic)
      ports:
        {{- range .Values.networkPolicy.traefik.ingressPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}

  # Egress: Allow only to designated services and DNS
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Allow Kubernetes API access (for CRD watching)
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              component: apiserver
      ports:
        - protocol: TCP
          port: 6443

    # Allow egress to SecurityCenter service
    - to:
        - podSelector:
            matchLabels:
              app: sc-pod
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8837

    # Allow egress to Container Security backend
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: consec-blade
      ports:
        - protocol: TCP
          port: 443
{{- end }}