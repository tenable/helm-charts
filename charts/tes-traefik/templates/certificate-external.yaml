{{- $domain := include "tes-traefik.domain" . -}}
{{- /* IPv4 detection: matches dotted-quad format. Does not range-check octets (e.g. 999.0.0.1 passes);
     cert-manager admission will reject out-of-range values at apply time. */ -}}
{{- $isIP := regexMatch `^\d{1,3}(\.\d{1,3}){3}$` $domain -}}
{{- /* IPv6 detection: covers compressed (::1, fe80::1) and full forms used in real deployments.
     Does not exhaustively validate all RFC-5952 forms but handles deployment-realistic addresses. */ -}}
{{- $isIPv6 := regexMatch `^([0-9a-fA-F]{0,4}:){2,7}[0-9a-fA-F]{0,4}$` $domain -}}
{{- if and .Values.certificates.external.enabled $domain }}
---
# External TLS Certificate for browser → Traefik connections
# Covers hostname, IPv4 VIP, and IPv6 VIP deployments: the resolved address is placed
# in dnsNames (hostname) or ipAddresses (IPv4/IPv6) so TLS clients accept the cert.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-external-tls
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: certificate
spec:
  secretName: {{ .Values.certificates.external.secretName }}

  # Certificate duration and renewal
  duration: {{ .Values.certificates.external.duration | default "2160h" }}
  renewBefore: {{ .Values.certificates.external.renewBefore | default "720h" }}

  {{- $dnsNames := .Values.certificates.external.additionalDnsNames | default list }}
  {{- if and (not $isIP) (not $isIPv6) }}
  {{-   $dnsNames = prepend $dnsNames $domain }}
  {{- end }}
  {{- if $dnsNames }}
  # DNS SANs — used when the external address is a hostname
  dnsNames:
    {{- range $dnsNames }}
    - {{ . }}
    {{- end }}
  {{- end }}

  {{- $ipAddresses := .Values.certificates.external.additionalIpAddresses | default list }}
  {{- if or $isIP $isIPv6 }}
  {{-   $ipAddresses = prepend $ipAddresses $domain }}
  {{- end }}
  {{- if $ipAddresses }}
  # IP SANs — required when TES is reached by a VIP or raw IP address
  ipAddresses:
    {{- range $ipAddresses }}
    - {{ . }}
    {{- end }}
  {{- end }}

  # Issuer reference
  issuerRef:
    {{- if eq (.Values.certificates.external.issuerRef.kind | default "ClusterIssuer") "Issuer" }}
    name: {{ .Release.Namespace }}-{{ .Values.certificates.external.issuerRef.name }}
    {{- else }}
    name: {{ .Values.certificates.external.issuerRef.name }}
    {{- end }}
    kind: {{ .Values.certificates.external.issuerRef.kind | default "ClusterIssuer" }}
    group: cert-manager.io

  # Key configuration
  privateKey:
    algorithm: RSA
    size: 2048

  # Usage - server authentication for external TLS
  usages:
    - digital signature
    - key encipherment
    - server auth
{{- end }}