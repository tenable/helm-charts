{{- if .Values.ingressRoutes.sensor.enabled }}
---
# IngressRouteTCP for Sensor Traffic (Port 8837)
# TCP/TLS passthrough for Nessus scanner connections to SecurityCenter
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ .Values.ingressRoutes.sensor.name }}
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    {{- range .Values.ingressRoutes.sensor.entrypoints }}
    - {{ . }}
    {{- end }}
  tls:
    passthrough: true
  routes:
  - match: HostSNI(`*`)
    priority: {{ .Values.ingressRoutes.sensor.priority }}
    services:
    - name: {{ .Values.tes.securityCenterService }}
      port: 8837
{{- end }}
